name: Zlachny build and visual QA

on:
  push:
    branches: [main]
    paths:
      - 'zoz-external-brain-app/zlachny-chisinau/**'
      - '.github/workflows/zlachny-build-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Keep Pages configured as: Deploy from a branch / main / (root).
# This workflow operates only on public files in this repository.
concurrency:
  group: zlachny-build-qa-${{ github.ref }}
  cancel-in-progress: false

env:
  QA_BASE_URL: https://zozmanz-creator.github.io/zoz-external-brain-app/zlachny-chisinau

jobs:
  build-publish-qa:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    # Playwright 1.52.0 supports Ubuntu 24.04; ubuntu-latest can advance past it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.1.0
      - name: Generate local images and v10 files
        working-directory: zoz-external-brain-app/zlachny-chisinau
        run: python scripts/build_v10.py
      - name: Static validation
        working-directory: zoz-external-brain-app/zlachny-chisinau
        run: |
          python -m json.tool venues-v10.json >/dev/null
          node --check v10.js
          grep -q 'data-build="v10"' index.html
          ! grep -E 'pexels|unsplash|squarespace-cdn' v10.css venues-v10.json
      - name: Commit generated local assets
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add zoz-external-brain-app/zlachny-chisinau/index.html zoz-external-brain-app/zlachny-chisinau/v10.css zoz-external-brain-app/zlachny-chisinau/v10.js zoz-external-brain-app/zlachny-chisinau/venues-v10.json zoz-external-brain-app/zlachny-chisinau/assets
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Build Zlachny v10 local assets [asset-bot]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Request Pages build for generated files
        # GITHUB_TOKEN pushes do not automatically trigger a branch Pages build.
        # Request one explicitly instead of testing a previously published v10.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
      - name: Wait for tested commit to publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            build=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '[.status, .commit] | @tsv')
            read -r status published_sha <<<"$build"
            if [ "$published_sha" = "$EXPECTED_SHA" ]; then
              if [ "$status" = "built" ]; then
                html=$(curl -fsSL "${QA_BASE_URL}/?qa=${EXPECTED_SHA}" || true)
                if grep -q 'data-build="v10"' <<<"$html"; then exit 0; fi
              elif [ "$status" = "errored" ]; then
                echo "Pages build failed for ${EXPECTED_SHA}."
                exit 1
              fi
            fi
            echo "Waiting for GitHub Pages commit ${EXPECTED_SHA} ($attempt/60)…"
            sleep 10
          done
          echo "The expected commit was not confirmed as published; browser QA was not run."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser QA
        working-directory: zoz-external-brain-app/zlachny-chisinau
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test published desktop and mobile site
        id: playwright
        continue-on-error: true
        working-directory: zoz-external-brain-app/zlachny-chisinau
        env:
          GITHUB_SHA: ${{ steps.commit.outputs.sha }}
          UPDATE_VISUAL_BASELINE: ${{ contains(github.event.head_commit.message, '[update-baseline]') && '1' || (hashFiles('zoz-external-brain-app/zlachny-chisinau/qa/baseline/desktop.png') == '' && '1' || '0') }}
        run: npx playwright test
      - name: QA summary
        if: always() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure')
        working-directory: zoz-external-brain-app/zlachny-chisinau
        run: |
          node tests/write-summary.js || true
          if [ -f qa-output/summary.md ]; then cat qa-output/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Persist latest QA evidence in repository
        # Preserve existing evidence when setup or deployment prevents QA from running.
        if: always() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure')
        env:
          QA_OUTCOME: ${{ steps.playwright.outcome }}
          TESTED_SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rm -rf zoz-external-brain-app/zlachny-chisinau/qa/latest
          mkdir -p zoz-external-brain-app/zlachny-chisinau/qa/latest
          cp zoz-external-brain-app/zlachny-chisinau/qa-output/summary.md zoz-external-brain-app/zlachny-chisinau/qa/latest/summary.md 2>/dev/null || true
          cp zoz-external-brain-app/zlachny-chisinau/qa-output/*-metrics.json zoz-external-brain-app/zlachny-chisinau/qa/latest/ 2>/dev/null || true
          cp zoz-external-brain-app/zlachny-chisinau/qa-output/*-actual.png zoz-external-brain-app/zlachny-chisinau/qa/latest/ 2>/dev/null || true
          cp zoz-external-brain-app/zlachny-chisinau/qa-output/*-full.png zoz-external-brain-app/zlachny-chisinau/qa/latest/ 2>/dev/null || true
          cp zoz-external-brain-app/zlachny-chisinau/qa-output/*-diff.png zoz-external-brain-app/zlachny-chisinau/qa/latest/ 2>/dev/null || true
          cat > zoz-external-brain-app/zlachny-chisinau/qa/latest/run.json <<EOF
          {"outcome":"${QA_OUTCOME}","testedSha":"${TESTED_SHA}","runId":"${{ github.run_id }}","runUrl":"${RUN_URL}","generatedAt":"$(date -u +%FT%TZ)"}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add zoz-external-brain-app/zlachny-chisinau/qa/latest zoz-external-brain-app/zlachny-chisinau/qa/baseline
          if ! git diff --cached --quiet; then
            git commit -m "Record Zlachny v10 visual QA ${QA_OUTCOME} [qa-bot]"
            git push
          fi
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zlachny-v10-visual-qa-${{ github.run_number }}
          path: |
            zoz-external-brain-app/zlachny-chisinau/qa-output
            zoz-external-brain-app/zlachny-chisinau/playwright-report
            zoz-external-brain-app/zlachny-chisinau/test-results
          retention-days: 30
      - name: Fail workflow when browser QA fails
        if: steps.playwright.outcome == 'failure'
        run: exit 1
